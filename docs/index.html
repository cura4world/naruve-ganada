<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBFAF6">
<title>Korean Pronunciation</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<!-- text that never changes at runtime carries data-i18n; applyLang() in
     app.js fills it from ui.js. Anything set from JS uses t() directly. -->
<div class="phone">

  <header class="topbar">
    <div class="brand"><div class="seal-mark">말</div><span data-i18n="brand">Pronunciation</span></div>
    <!-- no space here on purpose: the gap belongs to the string, because
         Korean writes 27회 with none and English writes 27 checks with one -->
    <div class="credits"><b id="credits">30</b><span data-i18n="checksLeft"> checks left</span></div>
  </header>

  <div class="strip">
    <div class="where"><b id="curCol">Drama</b><span class="dot"></span><span class="set" id="curSet">Reactions</span></div>
    <div style="display:flex;gap:7px;flex:none">
      <button class="browse-btn" id="l1Btn">EN</button>
      <button class="browse-btn" id="openBrowse" data-i18n="browse">Browse</button>
    </div>
  </div>

  <main class="stage">
    <div class="tiles" id="tiles"></div>
    <div class="meta-row" id="metaRow"></div>
    <div class="romanized" id="roman"></div>
    <div class="gloss" id="gloss"></div>
    <div class="toneHint" id="toneHint"></div>

    <button class="pair-link" id="pairLink">
      <div class="pl-lab" id="plLab"></div>
      <div class="pl-txt" id="plTxt"></div>
    </button>

    <button class="listen" id="listen">
      <span class="tri"></span>
      <span class="bars"><i></i><i></i><i></i></span>
      <span id="listenLabel">Hear it spoken</span>
    </button>
    <div class="audio-note" id="audioNote"></div>

    <section class="result" id="result" aria-live="polite">
      <div class="score-row">
        <div class="score-num" id="scoreNum">0</div>
        <div class="score-meta">
          <div class="score-label" data-i18n="scoreLabel">Your score</div>
          <div class="score-verdict" id="verdict">—</div>
        </div>
      </div>
      <!-- B-3: what the final contour actually did, in the learner's language -->
      <div class="into-note" id="intoNote"></div>
      <p class="note" id="note"></p>
      <div class="l1box" id="l1box">
        <div class="l1-lab" id="l1Lab">Why this happens</div>
        <div id="l1Body"></div>
      </div>
      <div class="actions">
        <button class="btn" id="share" data-i18n="shareBtn">Share card</button>
        <button class="btn primary" id="next" data-i18n="nextBtn">Next sentence</button>
      </div>
    </section>
  </main>

  <div class="record-zone">
    <button class="seal-btn" id="rec" data-i18n-aria="recordAria" aria-label="Record your voice">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 10.8a6.5 6.5 0 0 0 13 0"/>
        <line x1="12" y1="17.3" x2="12" y2="21"/><line x1="8.6" y1="21" x2="15.4" y2="21"/>
      </svg>
    </button>
    <div class="hint" id="hint">Tap and read it aloud</div>
    <!-- A-4: live proof the mic is receiving sound. CSS hides it unless body.dev -->
    <div class="micdev" id="micDev" aria-hidden="true">
      <div class="micdev-bar"><i id="micLevel"></i></div>
      <div class="micdev-txt" id="micStat">—</div>
      <div class="micdev-txt" id="micOut"></div>
    </div>
  </div>

  <!-- the row stays even when SIMULATE is hidden: buildtag lives here and it
       is how a deploy gets confirmed on the phone. See DEV_UNLOCK in app.js -->
  <div class="sim">
    <span class="sim-label" data-i18n="simLabel">Simulate</span>
    <button class="sim-btn on" data-lv="native" data-i18n="simNative">Native</button>
    <button class="sim-btn" data-lv="advanced" data-i18n="simAdvanced">Advanced</button>
    <button class="sim-btn" data-lv="intermediate" data-i18n="simIntermediate">Intermediate</button>
    <button class="sim-btn" data-lv="beginner" data-i18n="simBeginner">Beginner</button>
    <span class="buildtag" id="buildTag">v—</span>
  </div>

  <nav class="tabs">
    <button class="tab" aria-selected="true"><span class="ico">말</span><span data-i18n="tabPractice">Practice</span></button>
    <button class="tab" aria-selected="false"><span class="ico">높</span><span data-i18n="tabHonorifics">Honorifics</span></button>
    <button class="tab" aria-selected="false"><span class="ico">나</span><span data-i18n="tabYou">You</span></button>
  </nav>

  <section class="browse" id="browse" aria-hidden="true">
    <div class="b-head">
      <div class="b-title" data-i18n="browseTitle">Browse</div>
      <button class="b-close" id="closeBrowse" data-i18n-aria="close" aria-label="Close">×</button>
    </div>
    <div class="b-cols" id="bCols"></div>
    <div class="b-blurb" id="bBlurb"></div>
    <div class="b-list" id="bList"></div>
  </section>

</div>

<script src="./js/ui.js"></script>
<script src="./js/identity.js"></script>
<script src="./js/api.js"></script>
<script src="./js/audio.js"></script>
<script src="./js/mic.js"></script>
<script src="./js/pitch.js"></script>
<script src="./js/score.js"></script>
<script src="./js/data.js"></script>
<script src="./js/phonemes.js"></script>
<script src="./js/app.js"></script>
<script src="./js/boot.js"></script>
</body>
</html>
